name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type-check, Audit, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: npm test
